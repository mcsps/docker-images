name: Build Image kubectl

on:
  push:
    branches: [main]
    paths: 
    - 'kubectl/*'
    - '.github/workflows/kubectl.yaml'
  pull_request:
    paths:
    - 'kubectl/*'
    - '.github/workflows/kubectl.yaml'
  schedule:
    - cron: "15 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read kubectl version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ARG KUBECTL_VERSION=//p' kubectl/Dockerfile)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mcsps/kubectl
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: "v3.1.4"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./kubectl
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build and push
        id: build-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./kubectl
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/mcsps/kubectl:latest
            ${{ steps.meta.outputs.tags }}
      - name: Sign Push
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --key env://COSIGN_KEY --tlog-upload=false ghcr.io/mcsps/kubectl@${{ steps.build-push.outputs.digest }}
        env:
          COSIGN_KEY: ${{secrets.COSIGN_KEY}}
